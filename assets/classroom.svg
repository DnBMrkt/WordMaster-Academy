<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">WordMaster Academy classroom</title><desc id="desc">A cheerful, sunlit classroom with bookshelves, chalkboard, windows and three cartoon students waving.</desc>
<defs>
